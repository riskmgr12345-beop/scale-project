name: 저울 DART 재무경고 갱신

# 2026-09-05 사용자 요청("v3, 콜라, 환타, zz 등에서 분석 적용한 내용중 저울에 적용 도움되는
# 내용 모두 검토" -> "순서대로 시작해") -- 콜라 프로젝트의 DART 재무경고(완전자본잠식/3년연속
# 적자)+최근 60일 이벤트성 공시 연동을 저울에도 포팅. 원풍물산 사례처럼 순수 가격·거래량
# 통계로는 못 잡는 개별 종목 리스크(회사 자체가 위험한 경우)를 DART 재무제표로 선행 경고한다.
#
# 오늘 상위 20개(강한이김 후보)에만 한정 적용(dart_risk_check.py가 render_scale_report.py의
# build_report()로 오늘 후보를 먼저 뽑고, 그 종목들만 DART 조회) -- 2,700종목 전체를 매일
# 조회하면 API 부담이 크다. 클라우드 라우틴 샌드박스는 네트워크가 막혀 있어 이 스크립트를
# 못 돌리므로(FinanceDataReader/kospi_regime과 동일한 제약) GHA가 대신 매일 담당한다.
#
# 2026-09-05(첫 수동실행 실패로 발견/수정) -- build_report()가 콜라 캐시(limitup_ohlcv_
# cache.pkl)를 읽어야 하는데, 다른 두 워크플로(refresh_kospi_regime/refresh_verification_
# tracker)는 이게 필요 없어서 몰랐던 문제: 이 저장소만 체크아웃하면 "../limitup-precursor-
# research" 형제 폴더가 없어서 FileNotFoundError. 콜라 저장소도 같이 체크아웃해서 해결하려
# 했으나, 콜라(limitup-precursor-research)가 비공개 저장소라 기본 GITHUB_TOKEN(이 저장소
# 전용)으로는 접근 불가("Not Found") -- 별도 PAT(COLA_REPO_TOKEN 시크릿, repo 스코프)를
# 발급받아 그 체크아웃 단계에만 지정해서 해결.
#
# 필요 설정: 이 저장소(scale-project) Settings > Secrets and variables > Actions에
# - DART_API_KEY (opendart.fss.or.kr에서 발급)
# - COLA_REPO_TOKEN (github.com/settings/tokens에서 repo 스코프로 발급한 classic PAT --
#   콜라 저장소가 비공개라 이 계정 소유의 다른 저장소를 체크아웃하려면 필요)
# 둘 다 등록 필요.

on:
  schedule:
    - cron: '55 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scale-project
        uses: actions/checkout@v4
        with:
          path: scale-project

      - name: Checkout limitup-precursor-research (콜라 캐시 읽기전용, 비공개라 PAT 필요)
        uses: actions/checkout@v4
        with:
          repository: riskmgr12345-beop/limitup-precursor-research
          path: limitup-precursor-research
          token: ${{ secrets.COLA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r scale-project/requirements.txt

      - name: DART 재무경고 갱신
        working-directory: scale-project
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_risk_check.py

      - name: 변경사항 커밋
        working-directory: scale-project
        run: |
          git config user.name "scale-project-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dart_risk_cache.json dart_corp_codes.json
          git diff --cached --quiet && exit 0
          git commit -m "자동: 저울 DART 재무경고 갱신 $(date -u +%Y-%m-%d)"
          # 2026-09-05 정밀분석 -- 07:55~08:30 UTC 사이 자동 커밋 잡이 5개로 늘어나 서로 겹칠
          # 위험이 커짐. 다른 파일만 건드리므로 rebase 충돌 없이 안전하게 최신 원격을 반영한
          # 뒤 푸시.
          git pull --rebase origin main
          git push
